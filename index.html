<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Chattie - AI Chatbot met Meerdere Onderwerpen</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #c6f1ff, #f8fcff);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #chatbox {
      width: 100%;
      max-width: 720px;
      background: white;
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }
    h2 {
      text-align: center;
      color: #1a1a1a;
      margin-bottom: 10px;
    }
    .emoji {
      font-size: 36px;
      text-align: center;
      margin-bottom: 10px;
    }
    #messages {
      max-height: 400px;
      overflow-y: auto;
      margin-bottom: 25px;
      border: 1px solid #e0e0e0;
      padding: 20px;
      border-radius: 15px;
      background: #fefefe;
    }
    .message {
      margin: 12px 0;
      padding: 10px 15px;
      border-radius: 12px;
      max-width: 80%;
      word-wrap: break-word;
    }
    .user {
      background-color: #e0f0ff;
      color: #0b5394;
      align-self: flex-end;
      text-align: right;
      margin-left: auto;
    }
    .bot {
      background-color: #eafbe7;
      color: #2e7d32;
      align-self: flex-start;
      margin-right: auto;
    }
    .typing-indicator {
      font-size: 18px;
      font-style: italic;
      color: #ccc;
      text-align: left;
      margin-left: 20px;
      display: none;
    }
    #inputSection {
      display: flex;
      gap: 12px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border-radius: 15px;
      border: 1px solid #ccc;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 15px;
      background-color: #2196f3;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #1976d2;
    }
  </style>
</head>
<body>
<div id="chatbox">
  <h2>Hallo! Ik ben Chattie</h2>
  <div class="emoji">🤖💬</div>
  <p style="text-align: center; font-size: 16px; margin-top: -10px; margin-bottom: 20px; color: #333;">
    Begin je gesprek met het woord <strong>"start"</strong> en eindig met <strong>"einde"</strong>.
  </p>
  <div id="messages"></div>
  <div id="inputSection">
    <input type="text" id="userInput" placeholder="Typ 'start' om te beginnen">
    <button id="sendButton" type="button">Verstuur</button>
  </div>
  <div id="typingIndicator" class="typing-indicator">Chattie denkt even na...</div>
</div>
<script>
// Begrippenlijst
let begrippenlijst = {
  "ai": "AI is technologie die machines in staat stelt te denken zoals mensen.",
  "machine learning": "Machine learning is een tak van AI waarin systemen leren van data.",
  "sociaal welzijn": "Sociaal welzijn betreft de kwaliteit van leven en de mogelijkheid om actief deel te nemen aan de samenleving.",
  "pedagogisch werk": "Pedagogisch werk gaat over de begeleiding en opvoeding van jongeren in hun ontwikkeling.",
  "ethiek in het onderwijs": "Ethiek in het onderwijs is het onderzoeken van wat goed en fout is in het onderwijs en het begeleiden van studenten in hun ethische keuzes.",
  "natuur": "Weinig tot geen bebouwing, veel natuur, beschermde natuurgebieden, ongerepte natuur.",
  "industrieel": "Grote verkeerswegen, waterwegen, opslagplaatsen, rokende schoorstenen, fabrieken, havengebied.",
  "landelijk": "Huizen rond dorpsplein, huizen staan verspreid, bos, landelijk uitzicht, weiden en akkers.",
  "stedelijk": "Huizen dicht bij elkaar, hoogbouw, druk verkeer, veel mensen bij elkaar, weinig groen, weinig open ruimte.",
  "toeristisch": "Elementen om toeristen aan te trekken: skigebied, zon, zee, strand, bergen, attracties, pretparken, musea.",
  "synthese": "Samenvoeging van verschillende elementen tot een geheel.",
  "cognitieve vermogens": "Mentale capaciteiten zoals denken, begrijpen en leren.",
  "transfer learning": "Het toepassen van kennis van de ene taak op een andere taak.",
  "discriminator": "Machine die valse foto's beoordeelt.",
  "autonoom": "Zelfstandig, zonder menselijke tussenkomst.",
  "ethisch dilemma": "Situatie waarin een keuze gemaakt moet worden tussen twee morele principes.",
  "monopolie": "Situatie waarin één bedrijf of persoon de volledige controle heeft over een markt.",
  "privacy": "Het recht om persoonlijke informatie geheim te houden.",
  "regulering": "Het opstellen van regels en wetten om gedrag te sturen.",
  "deep blue": "Superslimme schaakcomputer.",
  "allen newell en herbert simon": "Ontwikkelden het eerste AI-programma in 1955.",
  "energieverbruik van ai": "AI verbruikt veel energie en water, vooral bij het trainen van grote modellen.",
  "discriminatie door ai": "AI kan onbedoeld discrimineren, zoals bij een sollicitatierobot die vrouwen uitsloot.",
  "privacy en veiligheid": "AI-systemen verwerken veel persoonsgegevens, daarom is het belangrijk na te denken over privacy en bescherming.",
  "toekomst van agi": "AGI is AI die op mensen lijkt qua denkvermogen. Het roept veel ethische vragen op.",
  "ava technologie": "Dit is een technologie die als een soort scanner een film of serie analyseert en er een geschikte thumbnail uit haalt.",
};

// LPAK gerichte vragen en antwoorden
let vragenLPAK = {
  "wat zegt het artikel over facebook en instagram": "Meta (Facebook & Instagram) wil vanaf 26 juni 2024 je openbare foto’s en berichten gebruiken om hun AI te trainen. Wil je dat niet? Dan moet je bezwaar maken via de instellingen van je account.",
  "hoe kan je je gegevens beschermen volgens het artikel": "Ga naar je instellingen en dien een bezwaar in via 'recht van bezwaar'. Dat moet vóór 26 juni. Leg daar uit waarom je niet akkoord bent.",
  "wat is het verband tussen de for you page en het artikel": "Beide gaan over hoe AI op basis van jouw gegevens inhoud personaliseert of traint. De For You Page op TikTok toont video's gebaseerd op gedrag; Meta wil jouw berichten gebruiken om AI slimmer te maken.",
  "wat is het voordeel van self learning": "Denk goed na: als een AI zichzelf kan verbeteren, wat betekent dat voor snelheid en onafhankelijkheid? Kun je voorbeelden bedenken waarbij dat nuttig zou zijn?",
  "is het een voordeel of nadeel dat computers zelf leren": "Probeer eerst zelf na te denken: Welke risico’s zie je? Wat zijn mogelijke voordelen? Je mag beide kanten benoemen.",
  "vertrouw jij ai in een zelfrijdende auto": "Denk aan wat je geleerd hebt over het trolleyprobleem of chatbot Tay. Wat zou jij belangrijk vinden in zo’n beslissing?",
  "wat zou agi betekenen voor armere landen": "Probeer je voor te stellen: Wat gebeurt er als rijke landen AGI ontwikkelen en armere landen dat niet kunnen? Is dat eerlijk? Wat zou jij voorstellen als oplossing?",
  "wat doet een webshop met je data": "Probeer na te gaan wat je ziet in je aanbevelingen. Koop je dingen die je net gezien hebt? Denk je dat dat toeval is of gestuurd door AI?",
  "wat zijn de vijf spelers": "Kijk goed naar welk logo in de smartphones staat. Je kan dit!",
};

const forbiddenWords = [
  "fuck", "sukkel", "idioot", "kanker", "terreur", "rotzak", "mierenneuker",
  "lul", "kut", "trut", "donderop", "nigger", "asshole", "bitch", "shit", "homo"
];

let gesprekActief = false;

function showTypingIndicator() {
  document.getElementById("typingIndicator").style.display = "block";
}

function hideTypingIndicator() {
  document.getElementById("typingIndicator").style.display = "none";
}

function addMessage(text, sender) {
  const div = document.createElement("div");
  div.className = `message ${sender}`;
  div.innerHTML = `<strong>${sender === 'user' ? 'Jij' : 'Chattie'}:</strong> ${text}`;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

const messages = document.getElementById("messages");
const inputBox = document.getElementById("userInput");
const sendButton = document.getElementById("sendButton");

sendButton.addEventListener("click", handleInput);

// ➕ ENTER-toets functionaliteit
inputBox.addEventListener("keypress", function (e) {
  if (e.key === "Enter") {
    handleInput();
  }
});

async function handleInput() {
  const input = inputBox.value.trim().toLowerCase();
  if (!input) return;

  addMessage(input, 'user');
  inputBox.value = "";
  showTypingIndicator();

  setTimeout(() => {
    hideTypingIndicator();
  }, 1000);

  if (forbiddenWords.some(word => input.includes(word))) {
    addMessage("Gebruik alsjeblieft respectvolle taal. Dit is een leeromgeving.", 'bot');
    return;
  }

  if (input.includes("start")) {
    gesprekActief = true;
    addMessage("Welkom! Stel mij je vraag.", 'bot');
    return;
  }

  if (!gesprekActief) {
    addMessage("Typ eerst 'start' om te beginnen.", 'bot');
    return;
  }

  if (input.includes("einde")) {
    gesprekActief = false;
    addMessage("Bedankt voor het gesprek! Geef je me een score (op 10)?", 'bot');
    return;
  }

  for (const key in begrippenlijst) {
    if (input.includes(key)) {
      addMessage(begrippenlijst[key], 'bot');
      return;
    }
  }

  for (const key in vragenLPAK) {
    if (input.includes(key)) {
      addMessage(vragenLPAK[key], 'bot');
      return;
    }
  }

  addMessage("Ik weet hier niet direct het antwoord op. Kan je het anders formuleren of specifieker maken?", 'bot');
}
</script>
</body>
</html>
