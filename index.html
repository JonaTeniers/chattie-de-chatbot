<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chattie - AI-leerbuddy</title>
<style>
:root {
  --bg1: #CFE3D3;
  --bg2: #F9F8F4;
  --card: #ffffff;
  --bot: #eaf7ee;
  --user: #E7DCC8;
  --accent: #A9C2A6;
  --muted: #8B8C89;
  --chip-bg: #CBBBA0;
  --chip-text: #3a301a;
  --status-active-color: #4CAF50;
  --status-escalation-color: #b45309;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
  background: linear-gradient(120deg, var(--bg1), var(--bg2));
  color: #0f172a;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}

.container {
  width: 100%;
  height: 100vh;
  background: var(--card);
  display: grid;
  grid-template-columns: 340px 1fr;
  overflow: hidden;
}

.left {
  padding: 20px;
  border-right: 1px solid rgba(0,0,0,0.04);
  background: linear-gradient(180deg, #fff, var(--bg2));
}

.avatar {
  width: 66px;
  height: 66px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--accent), var(--chip-bg));
  font-size: 28px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.05);
}

.title { font-weight: 700; margin-top: 6px; }
.subtitle { color: var(--muted); font-size: 13px; margin-top: 6px; }

.chat {
  display: flex;
  flex-direction: column;
  height: 100vh;
  padding: 18px;
  gap: 12px;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  border-radius: 12px;
  background: var(--bg2);
  border: 1px solid rgba(0,0,0,0.04);
}

.msg { display: flex; gap: 10px; margin: 10px 0; align-items: flex-end; }
.msg.bot { justify-content: flex-start; }
.msg.user { justify-content: flex-end; }
.bubble {
  max-width: 76%;
  padding: 12px 14px;
  border-radius: 14px;
  font-size: 15px;
  line-height: 1.35;
}
.bubble.bot { background: var(--bot); color: #05341a; border-radius: 14px 14px 14px 6px; }
.bubble.user { background: var(--user); color: #3a301a; border-radius: 14px 14px 6px 14px; text-align: right; }

.quick { display: flex; gap: 8px; flex-wrap: wrap; }

.chip-btn {
  background: var(--chip-bg);
  border-radius: 12px;
  padding: 8px 10px;
  border: 1px solid var(--muted);
  cursor: pointer;
  color: var(--chip-text);
  font-weight: 600;
  white-space: nowrap;
  font-size: 14px;
}

.input-row { display: flex; gap: 10px; }
.input-row input {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid rgba(0,0,0,0.06);
  font-size: 15px;
}
.send-btn {
  background: var(--accent);
  color: #fff;
  padding: 10px 16px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  font-weight: 700;
}

.muted { color: var(--muted); font-size: 13px; }

h4 { font-size: 16px; margin: 18px 0 8px 0; font-weight: 700; }

.status-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 5px;
}

@media (max-width:880px){
  .container {
    grid-template-columns: 1fr;
    border-radius: 18px;
    height: auto;
  }
  body { padding: 24px; }
}
</style>
</head>

<body>
<div class="container">
  <div class="left">
    <div style="display:flex;gap:12px;align-items:center">
      <div class="avatar">🤖</div>
      <div>
        <div class="title">Chattie je AI-leerbuddy</div>
        <div class="subtitle">Begin met "start" eindig met "einde".</div>
      </div>
    </div>

    <div style="margin-top:18px">
      <button id="howBtn" class="send-btn" style="width:100%;text-align:center;">Hoe werken de lessen?</button>
      <div class="muted" style="margin-top:10px;">Gebruik de knoppen onderin de chat voor snelle acties.</div>
    </div>

    <div style="margin-top:18px">
      <h4>Status & instellingen</h4>
      <div class="muted status-row">
        <span>Gesprek actief:</span>
        <span id="statusActive" style="font-weight:700;">Nee</span>
      </div>
      <div class="muted status-row" style="margin-top:6px;">
        <span>Escalatie:</span>
        <span id="escalation" style="font-weight:700;color:var(--status-escalation-color);">0</span>
      </div>
      <div class="muted" style="margin-top:8px">Geheugen:</div>
      <div id="memList" class="muted" style="max-height:90px;overflow:auto;padding-top:6px">Geen</div>
    </div>
  </div>

  <div class="chat">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <strong>Chat</strong>
      <div id="topRight" class="muted">Chattie is klaar</div>
    </div>

    <div id="messages" aria-live="polite"></div>

    <div class="quick" style="margin-top:10px; margin-bottom:12px;">
      <button class="chip-btn" data-action="more">Meer info</button>
      <button class="chip-btn" data-action="example">Voorbeeld</button>
      <button class="chip-btn" data-action="dontget">Ik snap het niet</button>
      <button class="chip-btn" data-action="assignment">Opdracht</button>
    </div>

    <div class="input-row" style="margin-top:12px">
      <input id="userInput" placeholder='Typ "start" om te beginnen of stel een vraag' autocomplete="off" />
      <button id="sendButton" class="send-btn">Verstuur</button>
    </div>
  </div>
</div>

<script>
// CONFIG
const RESET_CODE = "resetchattie2025";
const ESCALATION_LIMIT = 3;
const TYPING_MS = 800;

const FORBIDDEN = ["fuck","kut","lul","trut","sukkel","idioot","kanker","rotzak","hoer","slet","eikel","klootzak","mongool","flikker","aso","wijf","tyfus","tering","pleuris",   "pest","debiel","achterlijk","mafkees","lapzwans","snol","del","kech","zak","schijt","gay","lesbo","mietje","poot","pot","nicht","faggot","fag","dyke","tranny","transseksueel","homofiel","kontneuker","biseksueel","motherfucker","cunt"];

const KNOWLEDGE = {
 const KNOWLEDGE = {
  "ai": "AI is technologie die machines in staat stelt te denken en leren zoals mensen.",
  "machine learning": "Machine learning is een tak van AI waarbij systemen leren van data.",
  "deep learning": "Een vorm van machine learning met neurale netwerken die complexe patronen herkennen.",
  "sociaal welzijn": "De mate waarin mensen zich goed voelen en kunnen deelnemen aan de samenleving.",
  "pedagogisch werk": "Het begeleiden en opvoeden van jongeren in hun ontwikkeling.",
  "ethiek": "Nadenken over wat goed of fout is in het handelen van mensen (en AI-systemen).",
  "ethiek in het onderwijs": "Het nadenken over morele keuzes binnen onderwijs en opvoeding.",
  "natuur": "Weinig of geen bebouwing, veel groen, bossen, velden en dieren.",
  "industrieel": "Omgeving met fabrieken, transport, opslag en weinig groen.",
  "landelijk": "Huizen staan verspreid, open ruimte, akkers en weilanden.",
  "stedelijk": "Huizen dicht bij elkaar, hoogbouw, druk verkeer, weinig natuur.",
  "toeristisch": "Omgeving met veel attracties, strand, bergen of musea voor bezoekers.",
  "cognitieve vermogens": "Mentale vaardigheden zoals denken, leren en begrijpen.",
  "autonoom": "Zelfstandig, zonder menselijke tussenkomst.",
  "ethisch dilemma": "Een situatie waarbij je moet kiezen tussen twee waarden of principes.",
  "privacy": "Het recht om persoonlijke informatie geheim te houden.",
  "deepfake": "Een door AI gemanipuleerde video of foto die echt lijkt, maar nep is.",
  "discriminatie door ai": "AI kan onbedoeld bevooroordeeld zijn, bijvoorbeeld bij sollicitaties.",
  "energieverbruik van ai": "Het trainen van AI kost veel energie en water.",
  "agi": "Artificial General Intelligence — een AI die net zo slim is als mensen.",
  "ava technologie": "Technologie die automatisch de beste thumbnail kiest voor een video.",
  "zelfrijdende auto": "Een voertuig dat zonder chauffeur rijdt door sensoren en AI.",
  "autonome shuttle": "Een klein zelfrijdend busje, zoals in Leuven, dat leert uit zijn omgeving.",
  "senaat lek": "Een ernstig datalek bij de Belgische Senaat waarbij gevoelige info, zoals protocollen en gsm-nummers van politici, op straat kwam door een gelekt wachtwoord.",
  "infostealer": "Kwaadaardige software (zoals Lumma Stealer) die ongemerkt ingevoerde gegevens steelt en verkoopt aan criminelen.",
  "multifactorauthenticatie": "Een extra beveiligingsstap (zoals een sms-code) die veel hacks kan voorkomen.",
  "wachtwoord hygiëne": "Gebruik altijd unieke, lange wachtwoorden voor elke dienst om te voorkomen dat één lek alles compromitteert.",
  "datingfraude ai": "Malafide datingsites gebruiken AI om kwetsbare singles financieel op te lichten met deels gegenereerde berichten en dure betaalmodellen.",
  "jump4love": "Een voorbeeld van een louche site met nepprofielen en gestolen foto's, waar gebruikers met AI of callcenter-medewerkers chatten zonder echte date.",
  "ai en emotie": "Sommige AI-modellen simuleren emoties om gebruikers langer aan de praat te houden en meer geld te verdienen.",
  "kwetsbare singles": "Vooral oudere en eenzame mensen zijn doelwit van AI-gestuurde datingfraude omdat ze sneller emotioneel gehecht raken.",
  "internationale fraude": "De fraude wordt vaak gerund via postbusfirma’s in het buitenland, wat vervolging moeilijk maakt.",
  "peter opgelicht crypto": "Een Belg werd slachtoffer van een georganiseerde WhatsApp-oplichting waarbij hij 300.000 euro verloor aan een nep-crypto-platform.",
  "pig butchering": "Een oplichtingsmethode waarbij fraudeurs langdurig vertrouwen opbouwen en dan financieel toeslaan.",
  "oplichting gevolgen": "Slachtoffers verliezen niet alleen geld, maar ook zelfvertrouwen en relaties door schaamte en schuldgevoel.",
  "fraude psychologie": "Fraudeurs zijn psychologisch getraind om emoties en vertrouwen van slachtoffers te manipuleren.",
  "rode vlaggen fraude": "Belangrijke waarschuwingstekens zijn onbekende nummers, tijdsdruk en eisen om extra geld te storten.",
  "historisch referentie kader": "Een historisch referentiekader is een structuur om historische gebeurtenissen te situeren in tijd en ruimte en te linken aan maatschappelijke domeinen (Politiek, Sociaal, Cultureel, Economisch).",
  "voorbeeld historisch referentie kader":
`Hier is een voorbeeld van het historisch referentiekader voor de Olympische Spelen:

Jaar | Plaats | Domeinen | Uitleg
-----|---------|----------|------------------------------------------------------------
1896 | Athene | Sociaal, Cultureel | De eerste moderne Spelen; start van een internationale sporttraditie.
1916 | Berlijn | Politiek | Geannuleerd door de Eerste Wereldoorlog.
1936 | Berlijn | Politiek, Cultureel | Nazi-Duitsland gebruikte de Spelen als propagandamiddel.
1972 | München | Politiek, Sociaal | Terroristische aanslag op Israëlische sporters — wereldwijde impact op veiligheid.
1980 | Moskou | Politiek | Boycot door ±40 landen (o.a. VS) uit protest tegen de inval in Afghanistan.
2020/2021 | Tokio | Sociaal, Economisch | Uitstel door coronacrisis; verlies van toerisme en sponsorinkomsten.`
};


const ASSIGNMENTS = [
  "Bedenk een ethisch dilemma rond een zelfrijdende auto.",
  "Zoek een voorbeeld van deepfake en leg uit waarom het gevaarlijk kan zijn.",
  "Noem de vier maatschappelijke domeinen die we in de les hebben behandeld.",
  "Geef een voorbeeld van hoe politiek de Olympische Spelen heeft beïnvloed na 1970."
];

// STATE
let isChatActive = false;
let escalation = Number(localStorage.getItem('chattie_escalation') || 0);
let memory = JSON.parse(localStorage.getItem('chattie_memory') || '{}');
let isDisabled = localStorage.getItem('chattie_disabled') === '1';

// DOM
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('userInput');
const sendBtn = document.getElementById('sendButton');
const chips = document.querySelectorAll('.chip-btn[data-action]');
const howBtn = document.getElementById('howBtn');
const statusActiveEl = document.getElementById('statusActive');
const escalationEl = document.getElementById('escalation');
const memListEl = document.getElementById('memList');
const topRightEl = document.getElementById('topRight');

// HELPERS
function safeText(text){
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
function appendMessage(text, who='bot'){
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  const b = document.createElement('div');
  b.className = 'bubble ' + who;
  b.innerHTML = safeText(text).replace(/\n/g,'<br>');
  el.appendChild(b);
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function updateUI(){
  statusActiveEl.textContent = isChatActive ? 'Ja' : 'Nee';
  statusActiveEl.style.color = isChatActive ? 'var(--status-active-color)' : 'var(--muted)';
  escalationEl.textContent = escalation;
  escalationEl.style.color = escalation >= ESCALATION_LIMIT ? 'red' : 'var(--status-escalation-color)';
  memListEl.textContent = Object.keys(memory).length ? Object.keys(memory).slice(-6).join(", ") : "Geen";
  topRightEl.textContent = isDisabled ? 'Chattie is uitgeschakeld' : 'Chattie is klaar';
  document.body.style.filter = isDisabled ? 'grayscale(70%)' : 'none';
}
function saveState(){
  localStorage.setItem('chattie_escalation', String(escalation));
  localStorage.setItem('chattie_memory', JSON.stringify(memory));
  localStorage.setItem('chattie_disabled', isDisabled ? '1' : '0');
}
function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

async function showTyping(){
  appendMessage("Chattie denkt even na...", 'bot');
  await sleep(TYPING_MS);
  const last = messagesEl.lastElementChild;
  if (last && last.querySelector('.bubble') && last.querySelector('.bubble').textContent.includes('denkt even na')) {
    last.remove();
  }
}

async function chattieAnswer(rawInput){
  if (isDisabled) return;
  const input = String(rawInput || '').toLowerCase().trim();
  if (!input) return;

  if (FORBIDDEN.some(w => input.includes(w))) {
    escalation++;
    saveState(); updateUI();
    appendMessage("Gebruik alsjeblieft respectvolle taal.");
    if (escalation >= ESCALATION_LIMIT) {
      appendMessage("🚫 Chattie schakelt zichzelf uit wegens herhaald ongepast gedrag.");
      isDisabled = true; saveState(); updateUI();
    }
    return;
  }

  if (input === 'start' || input === 'begin') {
    isChatActive = true; updateUI();
    appendMessage("Welkom! 👋 Ik ben Chattie — stel me vragen over AI of geschiedenis. Typ 'help' voor suggesties.");
    return;
  }
  if (!isChatActive) { appendMessage("Typ eerst 'start' om te beginnen."); return; }
  if (input === 'einde' || input === 'stop') {
    isChatActive = false; updateUI();
    appendMessage("Bedankt voor het gesprek! 💬");
    return;
  }
  if (input.includes('help')) {
    appendMessage("Voorbeelden: 'Wat is AI?', 'Wat is historisch referentie kader', of gebruik de knoppen hieronder.");
    return;
  }
  if (input.includes('opdracht')) {
    const a = ASSIGNMENTS[Math.floor(Math.random()*ASSIGNMENTS.length)];
    appendMessage("Opdracht: " + a);
    return;
  }

  for (const key of Object.keys(KNOWLEDGE)) {
    if (input.includes(key)) {
      memory[key] = KNOWLEDGE[key];
      saveState(); updateUI();
      appendMessage(KNOWLEDGE[key]);
      appendMessage(`Wat vind jij van "${key}"?`);
      return;
    }
  }

  appendMessage("Daar weet ik niet direct het antwoord op 🤔. Wil je dat ik een voorbeeld geef?");
}

async function onSend(){
  const raw = inputEl.value || '';
  const trimmed = raw.trim();
  if (!trimmed) return;

  if (isDisabled) {
    if (trimmed.toLowerCase() === RESET_CODE) {
      isDisabled = false; escalation = 0; memory = {}; saveState(); updateUI();
      appendMessage("✅ Beveiligingscode geaccepteerd. Chattie is opnieuw geactiveerd.");
    } else {
      appendMessage("🚫 Chattie is uitgeschakeld. Gebruik de leerkrachtcode om hem opnieuw te activeren.");
    }
    inputEl.value = '';
    return;
  }

  appendMessage(trimmed, 'user');
  inputEl.value = '';
  await showTyping();
  await chattieAnswer(trimmed);
}

function handleQuickIntent(action){
  if (!isChatActive) { appendMessage("Typ eerst 'start' om te beginnen."); return; }
  if (action === 'more') appendMessage("Wil je meer info over het laatst besproken onderwerp?");
  else if (action === 'example') appendMessage("Geef een onderwerp en ik geef een voorbeeld, bijv. 'voorbeeld historisch referentie kader'.");
  else if (action === 'dontget') appendMessage("Geen probleem! Welk concept moet ik eenvoudiger uitleggen?");
  else if (action === 'assignment') {
    const a = ASSIGNMENTS[Math.floor(Math.random()*ASSIGNMENTS.length)];
    appendMessage("Opdracht: " + a);
  }
}

function attachEvents(){
  sendBtn.addEventListener('click', onSend);
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') onSend(); });
  chips.forEach(ch => ch.addEventListener('click', () => {
    const action = ch.getAttribute('data-action');
    appendMessage(ch.textContent, 'user');
    showTyping().then(() => handleQuickIntent(action));
  }));
  howBtn.addEventListener('click', () => {
    appendMessage("In deze lessen leer je wat AI is, waar je het tegenkomt en welke ethische vragen erbij horen. Gebruik Chattie als vraagbaak.");
  });
}

function init(){
  updateUI();
  if (isDisabled) {
    setTimeout(() => appendMessage("Chattie is uitgeschakeld. Vraag je leerkracht om de resetcode."), 200);
  } else {
    appendMessage("Typ 'start' om te beginnen!");
  }
  attachEvents();
}

init();
</script>
</body>
</html>
