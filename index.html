<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Chattie - AI Chatbot met Meerdere Onderwerpen</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #c6f1ff, #f8fcff);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #chatbox {
      width: 100%;
      max-width: 720px;
      background: white;
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }
    h2 {
      text-align: center;
      color: #1a1a1a;
      margin-bottom: 10px;
    }
    .emoji {
      font-size: 36px;
      text-align: center;
      margin-bottom: 10px;
    }
    #messages {
      max-height: 400px;
      overflow-y: auto;
      margin-bottom: 25px;
      border: 1px solid #e0e0e0;
      padding: 20px;
      border-radius: 15px;
      background: #fefefe;
    }
    .message {
      margin: 12px 0;
      padding: 10px 15px;
      border-radius: 12px;
      max-width: 80%;
      word-wrap: break-word;
    }
    .user {
      background-color: #e0f0ff;
      color: #0b5394;
      align-self: flex-end;
      text-align: right;
      margin-left: auto;
    }
    .bot {
      background-color: #eafbe7;
      color: #2e7d32;
      align-self: flex-start;
      margin-right: auto;
    }
    .typing-indicator {
      font-size: 18px;
      font-style: italic;
      color: #ccc;
      text-align: left;
      margin-left: 20px;
      display: none;
    }
    #inputSection {
      display: flex;
      gap: 12px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border-radius: 15px;
      border: 1px solid #ccc;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 15px;
      background-color: #2196f3;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #1976d2;
    }
  </style>
</head>
<body>
<div id="chatbox">
  <h2>Hallo! Ik ben Chattie</h2>
  <div class="emoji">🤖💬</div>
  <p style="text-align: center; font-size: 16px; margin-top: -10px; margin-bottom: 20px; color: #333;">
    Begin je gesprek met het woord <strong>"start"</strong> en eindig met <strong>"einde"</strong>. Vergeet op het einde niet om me een beoordeling te geven!
  </p>
  <div id="messages"></div>
  <div id="inputSection">
    <input type="text" id="userInput" placeholder="Typ 'start' om te beginnen">
    <button id="sendButton">Verstuur</button>
  </div>
  <div id="typingIndicator" class="typing-indicator">Chattie denkt even na...</div>
</div>
<script>
let begrippenlijst = {
  // AI-gerelateerde begrippen
  "ai": "AI is technologie die machines in staat stelt te denken zoals mensen.",
  "machine learning": "Machine learning is een tak van AI waarin systemen leren van data.",
  
  // PAV-gerelateerde begrippen
  "sociaal welzijn": "Sociaal welzijn betreft de kwaliteit van leven en de mogelijkheid om actief deel te nemen aan de samenleving.",
  "pedagogisch werk": "Pedagogisch werk gaat over de begeleiding en opvoeding van jongeren in hun ontwikkeling.",
  "ethiek in het onderwijs": "Ethiek in het onderwijs is het onderzoeken van wat goed en fout is in het onderwijs en het begeleiden van studenten in hun ethische keuzes.",

  const begrippenlijst = {
  "natuur": "Weinig tot geen bebouwing, veel natuur, beschermde natuurgebieden, ongerepte natuur.",
  "industrieel": "Grote verkeerswegen, waterwegen, opslagplaatsen, rokende schoorstenen, fabrieken, havengebied.",
  "landelijk": "Huizen rond dorpsplein, huizen staan verspreid, bos, landelijk uitzicht, weiden en akkers.",
  "stedelijk": "Huizen dicht bij elkaar, hoogbouw, druk verkeer, veel mensen bij elkaar, weinig groen, weinig open ruimte.",
  "toeristisch": "Elementen om toeristen aan te trekken: skigebied, zon, zee, strand, bergen, attracties, pretparken, musea."
};


  
  // Extra begrippen
  "synthese": "Samenvoeging van verschillende elementen tot een geheel.",
  "cognitieve vermogens": "Mentale capaciteiten zoals denken, begrijpen en leren.",
  "transfer learning": "Het toepassen van kennis van de ene taak op een andere taak.",
  "discriminator": "Machine die valse foto's beoordeelt.",
  "autonoom": "Zelfstandig, zonder menselijke tussenkomst.",
  "ethisch dilemma": "Situatie waarin een keuze gemaakt moet worden tussen twee morele principes.",
  "monopolie": "Situatie waarin één bedrijf of persoon de volledige controle heeft over een markt.",
  "privacy": "Het recht om persoonlijke informatie geheim te houden.",
  "regulering": "Het opstellen van regels en wetten om gedrag te sturen.",
  "deep blue": "Superslimme schaakcomputer.",
  "allen newell en herbert simon": "Ontwikkelden het eerste AI-programma in 1955.",
  "elon musk": "Medeoprichter van OpenAI en betrokken bij de ontwikkeling van zelfrijdende auto's bij Tesla.",
  "energieverbruik van ai": "AI-systemen, vooral grote taalmodellen, verbruiken veel energie en water om servers koel te houden. Dit heeft een aanzienlijke impact op het milieu.",
  "privacy en veiligheid": "AI-systemen verzamelen en verwerken veel persoonlijke gegevens. Het is belangrijk om bewust te zijn van privacykwesties en de veiligheid van persoonlijke informatie.",
  "ethische dilemma's": "AI kan ethische dilemma's veroorzaken, zoals bij zelfrijdende auto's die beslissingen moeten nemen in noodsituaties. Het is belangrijk om na te denken over de morele implicaties van AI-beslissingen.",
  "discriminatie door ai": "AI-systemen kunnen onbedoeld discrimineren, zoals bij de sollicitatierobot van Amazon die vrouwen discrimineerde. Dit benadrukt het belang van ethische richtlijnen en toezicht bij het ontwikkelen van AI.",
  "gebruik van ai in gezondheidszorg": "AI wordt gebruikt om medische diagnoses te stellen, behandelingsplannen te maken en zelfs therapieën te bieden via chatbots. Dit kan de efficiëntie en nauwkeurigheid van de gezondheidszorg verbeteren.",
  "toekomst van agi": "Kunstmatige Algemene Intelligentie (AGI) is een toekomstig doel waarbij AI menselijke cognitieve vermogens kan evenaren. Dit kan grote veranderingen teweegbrengen in verschillende sectoren, maar roept ook vragen op over de haalbaarheid en wenselijkheid."
};

let gesprekActief = false;

// Type-indicator toevoegen
function showTypingIndicator() {
  document.getElementById("typingIndicator").style.display = "block";
}

function hideTypingIndicator() {
  document.getElementById("typingIndicator").style.display = "none";
}

// Geheugen voor vorige antwoorden
let geheugen = {}; // Geheugen voor antwoorden en documenten

// Functie om berichten toe te voegen
function addMessage(text, sender) {
  const div = document.createElement("div");
  div.className = `message ${sender}`;
  div.innerHTML = `<strong>${sender === 'user' ? 'Jij' : 'Chattie'}:</strong> ${text}`;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

// Zoekfunctie met Wikipedia
async function zoekOpInternet(vraag) {
  const taal = "nl"; // Zoeken in het Nederlands
  const response = await fetch(`https://${taal}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(vraag)}`);
  if (!response.ok) return null;
  const data = await response.json();
  return data.extract || "Sorry, ik kon geen informatie vinden.";
}

const messages = document.getElementById("messages");
const inputBox = document.getElementById("userInput");
const sendButton = document.getElementById("sendButton");

sendButton.addEventListener("click", handleInput);

// Het verwerken van de gebruikersinvoer
async function handleInput() {
  const input = inputBox.value.trim().toLowerCase();
  if (!input) return;
  
  addMessage(input, 'user');
  inputBox.value = "";
  showTypingIndicator();

  setTimeout(() => {
    hideTypingIndicator();
  }, 2000);

  if (input.includes("start")) {
    gesprekActief = true;
    addMessage("Welkom! Stel mij je vraag.", 'bot');
    return;
  }

  if (!gesprekActief) {
    addMessage("Typ eerst 'start' om te beginnen.", 'bot');
    return;
  }

  if (input.includes("einde")) {
    gesprekActief = false;
    addMessage("Bedankt voor het gesprek! Geef je me een score (op 10)?", 'bot');
    return;
  }

  // Begrippen zoeken
  for (const key in begrippenlijst) {
    if (input.includes(key)) {
      addMessage(begrippenlijst[key], 'bot');
      return;
    }
  }

  // Zoeken via Wikipedia
  const internetResult = await zoekOpInternet(input);
  if (internetResult) {
    addMessage("Volgens Wikipedia: " + internetResult, 'bot');
  } else {
    addMessage("Sorry, ik weet daar nog niet alles over. Wil je dat ik het opzoek via Wikipedia?", 'bot');
  }
}
</script>
</body>
</html>
